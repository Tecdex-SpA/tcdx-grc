services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_ORIGIN: https://grc-bk.tcdx.int

    image: tcdx-grc-frontend:phase3
    container_name: tcdx-grc-frontend

    restart: unless-stopped

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true
