services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: tcdx-grc-backend:phase3
    container_name: tcdx-grc-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "4000:4000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true
