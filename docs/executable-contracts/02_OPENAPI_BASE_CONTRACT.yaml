openapi: 3.1.0
info:
  title: TCDX GRC API Base Contract
  version: 1.0.0-contract-candidate
  description: >-
    Contrato schema-first aprobado de Fase 2 con las enmiendas PRE-F5, PRE-F5B, PRE-F5C y los cierres compatibles PRE-F5E. Publica 106 operaciones que cierran
    trazabilidad rector-capability-permission-audit-idempotency-modelo físico.
    H-003..H-005 autorizan las operaciones mínimas de Configuration,
    privacy retention/erasure y lifecycle-registry sobre entidades existentes.
    DR-PHASE5-API-READ-2026-09-17-002 autoriza exactamente 21 lecturas
    Core GRC sobre entidades y relaciones existentes, sin cambio de base de datos.
    DR-PRE-F5B-2026-09-21-004 cierra paginación, requests de mutación,
    materialización de Evidence y submit-for-review de Action sin iniciar Fase 5.
    PRE-F5E cierra tenantCreate, membershipCreate y membershipRoleAssign, amplía accessGet
    con los contextos tenant propios activos, materializa PlatformRoleAssignment como grant
    canónico candidato y separa el TCDX application JWT de todo token externo.
  x-contract-owner: Architecture Owner
  x-approving-human-roles:
    - Architecture Owner
    - Backend Owner
    - Security & Privacy Reviewer
  x-status: CANDIDATE_READY_FOR_HUMAN_REVIEW
  x-wire-conventions-status: CONTRACT_DEFINED
  x-master-regent: TCDX_GRC_MASTER_REGENT_BASELINE_v1.5_2026-09-16
  x-rector-candidate: TCDX_GRC_MASTER_REGENT_BASELINE_v1.6_2026-09-23
  x-phase-5-read-contract-decision: DR-PHASE5-API-READ-2026-09-17-002
  x-phase-5-read-contract-status: MATERIALIZED
  x-phase-5-executable-contracts-status: CLOSED
  x-database-contract-changed: true
servers:
  - url: /api/v1
    description: Major v1 tenant/business API base path; deployment host is environment configuration.
paths:
  "/access/me":
    get:
      operationId: accessGet
      tags: ["platform"]
      summary: "CORE_PLATFORM: accessGet"
      description: "Derived from 09,22,42 and PRE-F5E H6. Actor: authenticated human/M2M. No tenant header is required to discover the authenticated canonical UserIdentity's own active tenant contexts; service principals and other users' memberships never produce contexts. Contract shape: AccessQuery → EffectiveAccess."
      security: [{ bearerAuth: [] }]
      x-tcdx-capability: "CORE_PLATFORM"
      x-tcdx-permission: "authenticated context"
      x-tcdx-scope: "authenticated context; selected tenant is optional and never identity proof"
      x-tcdx-audit-event: "NONE"
      x-tcdx-domain-events: "NONE"
      x-tcdx-idempotency-class: "NATURALLY_IDEMPOTENT"
      x-tcdx-transaction-boundary: "RO"
      x-tcdx-physical-entities: "`iam.user_identities`, `iam.tenant_memberships`, `iam.membership_roles`, `iam.roles`, `platform.tenants`, `platform.entitlements`"
      x-tcdx-rector-source: "09,22,42; PRE-F5E H6"
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '200': { $ref: '#/components/responses/AccessGetSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
