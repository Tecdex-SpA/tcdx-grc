openapi: 3.1.0
info:
  title: TCDX GRC API Base Contract
  version: 1.0.0-contract-candidate
  description: >-
    Contrato schema-first aprobado de Fase 2 con la enmienda read PRE-F5. Publica 95 operaciones que cierran
    trazabilidad rector-capability-permission-audit-idempotency-modelo físico.
    H-003..H-005 autorizan las operaciones mínimas de Configuration,
    privacy retention/erasure y lifecycle-registry sobre entidades existentes.
    DR-PHASE5-API-READ-2026-09-17-002 autoriza exactamente 21 lecturas
    Core GRC sobre entidades y relaciones existentes, sin cambio de base de datos.
  x-contract-owner: Architecture Owner
  x-approving-human-roles:
    - Architecture Owner
    - Backend Owner
    - Security & Privacy Reviewer
  x-status: CANDIDATE_READY_FOR_HUMAN_REVIEW
  x-wire-conventions-status: CONTRACT_DEFINED
  x-master-regent: TCDX_GRC_MASTER_REGENT_BASELINE_v1.5_2026-09-16
  x-phase-5-read-contract-decision: DR-PHASE5-API-READ-2026-09-17-002
  x-phase-5-read-contract-status: MATERIALIZED
  x-database-contract-changed: false
servers:
  - url: /api/v1
    description: Major v1 tenant/business API base path; deployment host is environment configuration.
