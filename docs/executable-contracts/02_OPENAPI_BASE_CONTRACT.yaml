openapi: 3.1.0
info:
  title: TCDX GRC API Base Contract
  version: 1.0.0-contract-candidate
  description: >-
    Contrato schema-first de Fase 2. Publica sólo las 74 operaciones que cierran
    trazabilidad rector-capability-permission-audit-idempotency-modelo físico.
    H-003..H-005 autorizan las operaciones mínimas de Configuration,
    privacy retention/erasure y lifecycle-registry sobre entidades existentes.
  x-contract-owner: Architecture Owner
  x-approving-human-roles:
    - Architecture Owner
    - Backend Owner
    - Security & Privacy Reviewer
  x-status: CANDIDATE_READY_FOR_HUMAN_REVIEW
  x-wire-conventions-status: CONTRACT_DEFINED
  x-master-regent: TCDX_GRC_MASTER_REGENT_BASELINE_v1.4_2026-09-15
servers:
  - url: /api/v1
    description: Major v1 tenant/business API base path; deployment host is environment configuration.
paths:
  "/access/me":
    get:
      operationId: accessGet
      tags: ["platform"]
      summary: "CORE_PLATFORM: accessGet"
      description: "Derived from 09,22,42. Actor: authenticated human/M2M. Tenant semantics: resolves, never trusts claims for grants. Contract shape: AccessQuery → EffectiveAccess."
      security: [{ bearerAuth: [] }]
      x-tcdx-capability: "CORE_PLATFORM"
      x-tcdx-permission: "authenticated context"
      x-tcdx-scope: "tenant/platform as requested"
      x-tcdx-audit-event: "NONE"
      x-tcdx-domain-events: "NONE"
      x-tcdx-idempotency-class: "NATURALLY_IDEMPOTENT"
      x-tcdx-transaction-boundary: "RO"
      x-tcdx-physical-entities: "`iam.*`, `platform.entitlements`"
      x-tcdx-rector-source: "09,22,42"
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      responses:
        '200': { $ref: '#/components/responses/OperationSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
