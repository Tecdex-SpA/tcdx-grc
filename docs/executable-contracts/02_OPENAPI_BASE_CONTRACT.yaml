tags: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived TCDX application access-token JWT issued after external OIDC identity proof. External IdP access tokens, id_tokens and opaque provider tokens are never TCDX API bearer credentials. Backend validates the configured TCDX issuer/audience, asymmetric signature/key, algorithm allowlist, jti, time claims, principal_class and revocation state before GRC authorization.
  parameters:
    TenantContext:
      name: X-TCDX-Tenant-Id
      in: header
      required: true
      description: UUIDv7 tenant context for tenant business operations; forbidden for platform/global operations unless their approved operation contract explicitly requires a target tenant.
      schema:
        $ref: '#/components/schemas/UuidV7'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client-provided UUID accepted only when valid; server always returns the effective ID.
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional request attempt identifier; it is not an idempotency key.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required only for operations classified IDEMPOTENCY_KEY_REQUIRED. Bound to ownership, tenant when applicable, actor/client, operation and request fingerprint.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: page[cursor]
      in: query
      required: false
      schema: { type: string, minLength: 1 }
      description: >-
        Opaque cursor encoding the stable-order components and server-controlled continuation context.
        It is not authority: tenant, entitlement, scope, object policy and filters are revalidated and
        cannot be changed by cursor contents. Offset pagination is not accepted.
    PageSize:
      name: page[size]
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      description: Integer from 1 through 100. Non-integer, below-minimum or above-maximum values return the COMMON HTTP 400 validation error.
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated allowlisted fields; prefix '-' means descending. No arbitrary SQL expressions.
      schema: { type: string }
    Filter:
      name: filter
      in: query
      required: false
      description: Resource-specific allowlisted filter object; generic operators are not authorized by this base contract.
      schema: { type: string }
    LifecycleStateFilter:
      name: filter[lifecycle_state]
      in: query
      required: false
      description: Exact lifecycle-state value from the target resource contract; no generic operator syntax.
      schema: { type: string, minLength: 1 }
    RequirementIdFilter:
      name: filter[requirement_id]
      in: query
      required: false
      description: Existing Requirement reference; visibility of the Requirement is independently enforced.
      schema: { $ref: '#/components/schemas/UuidV7' }
    FrameworkVersionIdFilter:
      name: filter[framework_version_id]
      in: query
      required: false
      description: Existing entitled FrameworkVersion reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    ControlIdFilter:
      name: filter[control_id]
      in: query
      required: false
      description: Existing authorized Control reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    IssueIdFilter:
      name: filter[issue_id]
      in: query
      required: false
      description: Existing authorized parent Issue reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    ScopeSubjectIdFilter:
      name: filter[scope_subject_id]
      in: query
      required: false
      description: Existing same-tenant Subject used by the canonical scope relationship.
      schema: { $ref: '#/components/schemas/UuidV7' }
    OwnerSubjectIdFilter:
      name: filter[business_owner_subject_id]
      in: query
      required: false
      description: Existing same-tenant business-owner Subject; object policy remains authoritative.
      schema: { $ref: '#/components/schemas/UuidV7' }
    AssignedMembershipIdFilter:
      name: filter[assigned_membership_id]
      in: query
      required: false
      description: Existing active same-tenant membership used by the canonical assignment relationship.
      schema: { $ref: '#/components/schemas/UuidV7' }
    DueFromFilter:
      name: filter[due_from]
      in: query
      required: false
      description: Inclusive lower bound for an existing due date/timestamp field.
      schema: { type: string, format: date }
    DueToFilter:
      name: filter[due_to]
      in: query
      required: false
      description: Inclusive upper bound for an existing due date/timestamp field.
      schema: { type: string, format: date }
    ExpiresFromFilter:
      name: filter[expires_from]
      in: query
      required: false
      description: Inclusive lower bound over authorized EvidenceVersion expiry metadata.
      schema: { type: string, format: date-time }
    ExpiresToFilter:
      name: filter[expires_to]
      in: query
      required: false
      description: Inclusive upper bound over authorized EvidenceVersion expiry metadata.
      schema: { type: string, format: date-time }
  headers:
    CorrelationId:
      description: Effective end-to-end correlation UUID.
      schema: { type: string, format: uuid }
    RequestId:
      description: Server request attempt UUID.
      schema: { type: string, format: uuid }
    IdempotencyReplayed:
      description: 'true when response is the persisted replay for the same fingerprint.'
      schema: { type: boolean }
  schemas:
    UuidV7:
      type: string
      format: uuid
      description: Opaque platform-generated UUIDv7; consumers must not derive semantics from it.
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with UTC offset Z at the API boundary.
    DataClassification:
      type: string
      enum: [public, internal, confidential, restricted]
      description: Closed, versioned Platform vocabulary. tenantCreate always persists the server-owned initial value confidential.
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required: [tenant_code, legal_name, display_name, default_timezone]
      properties:
        tenant_code: { type: string, minLength: 1, maxLength: 64 }
        legal_name: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        default_timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Canonical IANA timezone identifier validated by the server against its governed timezone database.
      description: tenant_id, lifecycle_state=active, data_classification=confidential, actors and technical timestamps are server-owned and forbidden as caller input.
    TenantProjection:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_code, legal_name, display_name, default_timezone, lifecycle_state, data_classification]
      properties:
        tenant_id: { $ref: '#/components/schemas/UuidV7' }
        tenant_code: { type: string, minLength: 1, maxLength: 64 }
        legal_name: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        default_timezone: { type: string, minLength: 1, maxLength: 64 }
        lifecycle_state: { type: string, const: active }
        data_classification:
          allOf:
            - { $ref: '#/components/schemas/DataClassification' }
            - { const: confidential }
    TenantCreateOperationResult:
      type: object
      additionalProperties: false
      required: [operation_id, status, correlation_id, resource_id, result]
      properties:
        operation_id: { type: string, const: tenantCreate }
        status: { type: string, const: completed }
        correlation_id: { type: string, format: uuid }
        resource_id: { $ref: '#/components/schemas/UuidV7' }
        result: { $ref: '#/components/schemas/TenantProjection' }
    MembershipCreateRequest:
      type: object
      additionalProperties: false
      required: [user_identity_id]
      properties:
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
      description: Selects one existing canonical UserIdentity. Tenant, membership ID, membership_state=active, joined/created timestamps, actor, email, invitation, external identity and role assignment are not caller fields.
    TenantMembershipProjection:
      type: object
      additionalProperties: false
      required: [tenant_membership_id, tenant_id, user_identity_id, membership_state, joined_at]
      properties:
        tenant_membership_id: { $ref: '#/components/schemas/UuidV7' }
        tenant_id: { $ref: '#/components/schemas/UuidV7' }
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        membership_state: { type: string, const: active }
        joined_at: { $ref: '#/components/schemas/UtcTimestamp' }
    MembershipCreateOperationResult:
      type: object
      additionalProperties: false
      required: [operation_id, status, correlation_id, resource_id, result]
      properties:
        operation_id: { type: string, const: membershipCreate }
        status: { type: string, const: completed }
        correlation_id: { type: string, format: uuid }
        resource_id: { $ref: '#/components/schemas/UuidV7' }
        result: { $ref: '#/components/schemas/TenantMembershipProjection' }
    AvailableTenantContext:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_display_name, tenant_membership_id, membership_state, effective_role_codes]
      properties:
        tenant_id: { $ref: '#/components/schemas/UuidV7' }
        tenant_display_name: { type: string, minLength: 1 }
        tenant_membership_id: { $ref: '#/components/schemas/UuidV7' }
        membership_state:
          type: string
          minLength: 1
          description: Canonical persisted membership state; only states effective as active under the approved lifecycle policy are returned.
        effective_role_codes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 96 }
          description: Minimal deduplicated active role-code summary for this membership, ordered lexicographically; it is display/selection data and not client-side authorization authority.
    EffectiveAccess:
      type: object
      additionalProperties: false
      required: [available_tenant_contexts]
      properties:
        available_tenant_contexts:
          type: array
          items: { $ref: '#/components/schemas/AvailableTenantContext' }
          description: Complete bounded set of the authenticated canonical UserIdentity's own active memberships in active tenants, ordered by tenant_display_name ASC then tenant_id ASC; no tenant header, global enumeration or pagination is used.
    MembershipRoleAssignRequest:
      type: object
      additionalProperties: false
      required: [role_id, scope_kind]
      properties:
        role_id: { $ref: '#/components/schemas/UuidV7' }
        scope_kind:
          type: string
          enum: [tenant, organizational_unit, process, service, audit_engagement, assigned_object, owned_object]
          description: Existing RBAC scope discriminant. platform is intentionally absent and a PLATFORM_CONTROL role is rejected.
        organizational_unit_id: { $ref: '#/components/schemas/UuidV7' }
        process_id: { $ref: '#/components/schemas/UuidV7' }
        service_id: { $ref: '#/components/schemas/UuidV7' }
        audit_id: { $ref: '#/components/schemas/UuidV7' }
        valid_to:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Optional canonical validity endpoint; it must be later than server-derived valid_from.
      allOf:
        - if: { required: [scope_kind], properties: { scope_kind: { const: organizational_unit } } }
          then: { required: [organizational_unit_id] }
          else: { not: { required: [organizational_unit_id] } }
        - if: { required: [scope_kind], properties: { scope_kind: { const: process } } }
          then: { required: [process_id] }
          else: { not: { required: [process_id] } }
        - if: { required: [scope_kind], properties: { scope_kind: { const: service } } }
          then: { required: [service_id] }
          else: { not: { required: [service_id] } }
        - if: { required: [scope_kind], properties: { scope_kind: { const: audit_engagement } } }
          then: { required: [audit_id] }
          else: { not: { required: [audit_id] } }
      description: Membership and tenant are derived from path and authenticated header. valid_from, actor, assignment ID and technical timestamps are server-owned. Role, membership and every structural scope reference must be active/assignable and same-tenant; PLATFORM_CONTROL roles fail closed.
    MembershipRoleAssignmentProjection:
      type: object
      additionalProperties: false
      required: [membership_role_id, tenant_membership_id, role_id, scope_kind, valid_from]
      properties:
        membership_role_id: { $ref: '#/components/schemas/UuidV7' }
        tenant_membership_id: { $ref: '#/components/schemas/UuidV7' }
        role_id: { $ref: '#/components/schemas/UuidV7' }
        scope_kind:
          type: string
          enum: [tenant, organizational_unit, process, service, audit_engagement, assigned_object, owned_object]
        organizational_unit_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        process_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        service_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        audit_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        valid_from: { $ref: '#/components/schemas/UtcTimestamp' }
        valid_to: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
    MembershipRoleAssignmentOperationResult:
      type: object
      additionalProperties: false
      required: [operation_id, status, correlation_id, resource_id, result]
      properties:
        operation_id: { type: string, const: membershipRoleAssign }
        status: { type: string, const: completed }
        correlation_id: { type: string, format: uuid }
        resource_id: { $ref: '#/components/schemas/UuidV7' }
        result: { $ref: '#/components/schemas/MembershipRoleAssignmentProjection' }
    OwnershipClass:
      type: string
      enum: [GLOBAL_REFERENCE, PLATFORM_CONTROL, TENANT_OWNED, TENANT_DERIVED]
    CalculationStatus:
      type: string
      enum: [pending, running, succeeded, failed, cancelled]
    ResultStatus:
      type: string
      enum: [valid, no_data, insufficient_data, insufficient_coverage, stale_source, conflicting_sources, dependency_pending, invalid_input, source_error, calculation_error, not_applicable, superseded]
    ResultEnvelope:
      type: object
      additionalProperties: false
      required: [result_status, period, lineage]
      properties:
        value: {}
        unit: { type: [string, 'null'] }
        result_status: { $ref: '#/components/schemas/ResultStatus' }
        domain_conclusion: { type: [string, 'null'] }
        period:
          type: object
          additionalProperties: false
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
        coverage_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        freshness_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        data_trust:
          type: [object, 'null']
          description: DataQualityAssessment reference/status; never silently alters value.
        versions: { type: object }
        lineage: { type: object }
        preview: { type: boolean, default: false }
      description: value is official only when result_status=valid; non-valid candidate values require preview=true and methodology authority.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_\.]*$' }
        message: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        details:
          type: object
          description: Allowlisted, non-secret details only; never SQL, stack traces, cross-tenant identifiers or signed URLs.
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    PageMeta:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    RequirementApplicabilityProjection:
