      type: object
      additionalProperties: false
      required: [membership_role_id, tenant_membership_id, role_id, scope_kind, valid_from, etag]
      properties:
        membership_role_id: { $ref: '#/components/schemas/UuidV7' }
        tenant_membership_id: { $ref: '#/components/schemas/UuidV7' }
        role_id: { $ref: '#/components/schemas/UuidV7' }
        scope_kind:
          type: string
          enum: [tenant, organizational_unit, process, service, audit_engagement, assigned_object, owned_object]
        organizational_unit_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        process_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        service_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        audit_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        valid_from: { $ref: '#/components/schemas/UtcTimestamp' }
        valid_to: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        etag: { type: string, pattern: '^[0-9a-f]{64}$' }
    MembershipRoleRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    MembershipRoleRevokeOperationResult:
      type: object
      additionalProperties: false
      required: [operation_id, status, correlation_id, resource_id, result]
      properties:
        operation_id: { type: string, const: membershipRoleRevoke }
        status: { type: string, const: completed }
        correlation_id: { type: string, format: uuid }
        resource_id: { $ref: '#/components/schemas/UuidV7' }
        result: { $ref: '#/components/schemas/MembershipRoleAssignmentProjection' }
    MembershipRoleAssignmentOperationResult:
      type: object
      additionalProperties: false
      required: [operation_id, status, correlation_id, resource_id, result]
      properties:
        operation_id: { type: string, const: membershipRoleAssign }
        status: { type: string, const: completed }
        correlation_id: { type: string, format: uuid }
        resource_id: { $ref: '#/components/schemas/UuidV7' }
        result: { $ref: '#/components/schemas/MembershipRoleAssignmentProjection' }
    OwnershipClass:
      type: string
      enum: [GLOBAL_REFERENCE, PLATFORM_CONTROL, TENANT_OWNED, TENANT_DERIVED]
    CalculationStatus:
      type: string
      enum: [pending, running, succeeded, failed, cancelled]
    ResultStatus:
      type: string
      enum: [valid, no_data, insufficient_data, insufficient_coverage, stale_source, conflicting_sources, dependency_pending, invalid_input, source_error, calculation_error, not_applicable, superseded]
    ResultEnvelope:
      type: object
      additionalProperties: false
      required: [result_status, period, lineage]
      properties:
        value: {}
        unit: { type: [string, 'null'] }
        result_status: { $ref: '#/components/schemas/ResultStatus' }
        domain_conclusion: { type: [string, 'null'] }
        period:
          type: object
          additionalProperties: false
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
        coverage_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        freshness_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        data_trust:
          type: [object, 'null']
          description: DataQualityAssessment reference/status; never silently alters value.
        versions: { type: object }
        lineage: { type: object }
        preview: { type: boolean, default: false }
      description: value is official only when result_status=valid; non-valid candidate values require preview=true and methodology authority.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_\.]*$' }
        message: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean }
        field_errors:
