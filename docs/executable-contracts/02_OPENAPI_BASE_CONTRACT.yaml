openapi: 3.1.0
info:
  title: TCDX GRC API Base Contract
  version: 1.0.0-contract-candidate
  description: >-
    Contrato schema-first aprobado de Fase 2 con las enmiendas PRE-F5, PRE-F5B, PRE-F5C, los cierres compatibles PRE-F5E y las decisiones Subscription, lecturas administrativas y Fase 5+. Publica 161 operaciones que cierran
    trazabilidad rector-capability-permission-audit-idempotency-modelo físico.
    H-003..H-005 autorizan las operaciones mínimas de Configuration,
    privacy retention/erasure y lifecycle-registry sobre entidades existentes.
    DR-PHASE5-API-READ-2026-09-17-002 autoriza exactamente 21 lecturas
    Core GRC sobre entidades y relaciones existentes, sin cambio de base de datos.
    DR-PRE-F5B-2026-09-21-004 cierra paginación, requests de mutación,
    materialización de Evidence y submit-for-review de Action sin iniciar Fase 5.
    PRE-F5E cierra tenantCreate, membershipCreate y membershipRoleAssign, amplía accessGet
    con los contextos tenant propios activos, materializa PlatformRoleAssignment como grant
    canónico candidato y separa el TCDX application JWT de todo token externo.
    Las ocho operaciones MI6A son contrato humano aprobado, sin ruta runtime ni
    Permission física publicada todavía.
  x-contract-owner: Architecture Owner
  x-approving-human-roles:
    - Architecture Owner
    - Backend Owner
    - Security & Privacy Reviewer
  x-status: CANDIDATE_READY_FOR_HUMAN_REVIEW
  x-wire-conventions-status: CONTRACT_DEFINED
  x-master-regent: TCDX_GRC_MASTER_REGENT_BASELINE_v1.7_2026-09-23
  x-phase-5-subscription-decision: HUMAN_APPROVED_2026-09-24
  x-phase-5-read-contract-decision: DR-PHASE5-API-READ-2026-09-17-002
  x-phase-5-read-contract-status: MATERIALIZED
  x-phase-5-administrative-read-decision: HUMAN_APPROVED_2026-09-28
  x-phase-5-plus-resolution: HUMAN_APPROVED_2026-09-29
  x-phase-5-executable-contracts-status: CLOSED
  x-step-23l-mi6a-admin-contract: HUMAN_APPROVED_DOC_ONLY_2026-10-01
  x-step-23l-mi6a-runtime-permissions-published: false
  x-step-23l-tenant-onboarding-d1-r: HUMAN_APPROVED_LOCAL_CONTRACT_ONLY
  x-d1-r-runtime-permission-publication: false
  x-d1-r-schema-change: false
  x-database-contract-changed: true
servers:
  - url: /api/v1
    description: Major v1 tenant/business API base path; deployment host is environment configuration.
paths:
  "/platform/tenants/{tenant_id}/users:onboard":
    post:
      operationId: tenantUserOnboardingCreate
      tags: [platform]
      summary: "Centralized user access to an explicitly selected company"
      description: "Executable26: Platform-only canonical identity/Membership onboarding and additive tenant-role reconciliation; target CORE_PLATFORM required. No bootstrap, identity creation, actor Membership, Keycloak authority or generic tenant assignment expansion. Safe durable partial progress; same original intent resumes pending roles only."
      security: [{ bearerAuth: [] }]
      x-tcdx-capability: "CORE_PLATFORM"
      x-tcdx-permission: "`platform.tenant_user.onboard`"
      x-tcdx-scope: "platform"
      x-tcdx-platform-only: true
      x-tcdx-tenant-header-policy: REJECT_403
      x-tcdx-audit-event: "`audit.platform.tenant_user.onboard.v1`"
      x-tcdx-domain-events: "iam.membership.created.v1, iam.role.assigned.v1; only new children"
      x-tcdx-idempotency-class: "IDEMPOTENCY_KEY_REQUIRED"
      x-tcdx-transaction-boundary: "MEMBERSHIP_AND_EACH_ROLE_CHILD_TX_WITH_DURABLE_PROGRESS"
      x-tcdx-physical-entities: "platform.tenants, iam.user_identities, iam.tenant_memberships, iam.roles, iam.membership_roles, canonical entitlement/audit/idempotency/outbox"
      x-tcdx-rector-source: "Human Managed Identity tenant E2E §§8–18; executable26; rector09/22/25/42"
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: tenant_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingRequest' } } } }
      responses:
        '201':
          description: Completed Membership and requested role receipt; no secrets.
          headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingResult' } } }
        '400': { description: 'Canonical safe rejection; committed child progress when available.', headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingError' } } } }
        '401': { description: 'Canonical safe rejection; committed child progress when available.', headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingError' } } } }
        '403': { description: 'Canonical safe rejection; committed child progress when available.', headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingError' } } } }
        '404': { description: 'Canonical safe rejection; committed child progress when available.', headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingError' } } } }
        '409': { description: 'Canonical safe rejection; committed child progress when available.', headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingError' } } } }
        '503': { description: 'Canonical safe rejection; committed child progress when available.', headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUserOnboardingError' } } } }
