        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthorizationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '503': { $ref: '#/components/responses/DependencyError' }
  "/user-identities":
    get:
      operationId: userIdentityDiscovery
      tags: ["iam"]
      summary: "D1-R privacy-minimized identity selection with exclusive Platform/tenant modes"
      description: "Executable25: explicit required mode. platform_search requires Platform authority and forbids tenant header. tenant_exact requires own active Membership, effective TENANT_ADMIN, CORE_PLATFORM and validated header; exact email/username, at most one eligible result, no directory/pagination. None/hidden/inactive/ambiguous return indistinguishable empty200. No raw criterion in audit/access logs; no body or unknown input. Authorization before lookup; all responses no-store."
      security: [{ bearerAuth: [] }]
      x-tcdx-capability: "CORE_PLATFORM"
      x-tcdx-permission: "`platform.user_identity.read`"
      x-tcdx-scope: "platform, tenant"
      x-tcdx-runtime-status: CONTRACT_ONLY_NOT_PUBLISHED
      x-tcdx-mode-authorization: { platform_search: PLATFORM_CHAIN_ONLY_NO_TENANT_HEADER, tenant_exact: OWN_ACTIVE_MEMBERSHIP_TENANT_ADMIN_CORE_PLATFORM_VALIDATED_HEADER }
      x-tcdx-tenant-exact-policy: { list: false, pagination: false, prefix: false, fuzzy: false, autocomplete: false, wildcard: false, maximum_results: 1 }
      x-tcdx-response-by-mode: { platform_search: "#/components/schemas/UserIdentityDiscoveryPage", tenant_exact: "#/components/schemas/UserIdentityDiscoveryTenantPage" }
      x-tcdx-input-log-policy: OMIT_RAW_LOOKUP_VALUE
      x-tcdx-cache-policy: NO_STORE_ALL_RESPONSES
      x-tcdx-audit-event: "`audit.platform.user_identity.discover.v1`"
      x-tcdx-domain-events: "NONE"
      x-tcdx-idempotency-class: "NATURALLY_IDEMPOTENT"
      x-tcdx-transaction-boundary: "RO_BUSINESS_PLUS_PRIVACY_AUDIT_APPEND"
      x-tcdx-physical-entities: "`iam.user_identities`, canonical grants/context, safe existing provider metadata, `ops_audit.audit_events`"
      x-tcdx-rector-source: "Human STEP 23L-TENANT-ONBOARDING-D1-R; executable25; rector09/22/25/42"
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - { name: mode, in: query, required: true, schema: { type: string, enum: [platform_search, tenant_exact] } }
        - { name: criterion, in: query, required: true, description: 'tenant_exact allows only email/username; display_name is Platform-only.', schema: { type: string, enum: [display_name, email, username] } }
        - { name: value, in: query, required: true, description: 'Complete exact email/username metadata; Platform name search is literal substring. No new normalization. Raw value omitted from audit/access logs.', schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: X-TCDX-Tenant-Id, in: header, required: false, description: 'Mandatory and backend-validated for tenant_exact; forbidden for platform_search. Never authority by itself.', schema: { $ref: '#/components/schemas/UuidV7' } }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { $ref: '#/components/responses/UserIdentityDiscoverySuccess' }
        '400': { $ref: '#/components/responses/UserIdentityDiscoveryError' }
        '401': { $ref: '#/components/responses/UserIdentityDiscoveryError' }
        '403': { $ref: '#/components/responses/UserIdentityDiscoveryError' }
        '429': { $ref: '#/components/responses/UserIdentityDiscoveryError' }
        '503': { $ref: '#/components/responses/UserIdentityDiscoveryError' }
