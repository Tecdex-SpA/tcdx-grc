          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthenticationError:
      description: Authentication missing or invalid; no tenant/object existence disclosure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthorizationError:
      description: Effective authorization denied; response must not reveal cross-tenant existence.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFoundError:
      description: Resource absent or deliberately concealed because it belongs to another tenant; details are indistinguishable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ConflictError:
      description: State, concurrency or idempotency conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  x-api-conventions:
    authentication: External OIDC Authorization Code + PKCE proves identity; the protected API accepts only the short-lived asymmetric TCDX application JWT with configured TCDX issuer/audience, canonical UserIdentity sub, jti/iat/exp, HUMAN_INTERACTIVE principal class and revocation checks. External access tokens, id_tokens and opaque provider tokens are not API bearers.
    request-media-type: application/json
    response-media-type: application/json; errors use application/problem+json
    headers: Authorization, Content-Type, Accept, X-Correlation-Id and Idempotency-Key use exactly these spellings; X-TCDX-Tenant-Id is required only on tenant-context operations and never grants access.
    versioning: Breaking changes require a new major base path.
    pagination: Opaque cursor with stable operation-allowlisted sort and UUIDv7 tie-breaker; command/single-resource operations do not paginate.
    tenant-context: Resolved and checked against active membership; never trusted as authorization solely because supplied by client.
    filtering: Resource-specific allowlists; no arbitrary field/operator language.
    optimistic-concurrency: Phase 5 stateful commands carry `expected_version`, which must equal the target row's explicit `row_version`; stale writes return 409. No `xmin`, implicit substitute or dual header authority is permitted.
    idempotency: PostgreSQL IdempotencyRecord is authoritative; Redis may not decide replay/conflict.
    files: Quarantine, type/size validation, malware scan, checksum and classification precede Evidence eligibility.
    async: Heavy reports/imports/bulk are jobs with row-level outcomes and explicit partial failure.
    provenance: Official results expose version, coverage, freshness, Data Trust and lineage subject to RBAC.
