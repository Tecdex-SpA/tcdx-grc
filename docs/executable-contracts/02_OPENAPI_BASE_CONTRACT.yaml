      description: Short-lived TCDX application access-token JWT issued after external OIDC identity proof. External IdP access tokens, id_tokens and opaque provider tokens are never TCDX API bearer credentials. Backend validates the configured TCDX issuer/audience, asymmetric signature/key, algorithm allowlist, jti, time claims, principal_class and revocation state before GRC authorization.
  parameters:
    AuthorizationProjectionTenantId:
      name: X-TCDX-Tenant-Id
      in: header
      required: false
      description: "Contract 23: optional own tenant candidate, validated against active membership; absence yields tenant_permissions null. Malformed/repeated header is 400; foreign/missing context is concealed. Never identity proof or Platform authority."
      schema: { $ref: '#/components/schemas/UuidV7' }
    TenantContext:
      name: X-TCDX-Tenant-Id
      in: header
      required: true
      description: UUIDv7 tenant context for tenant business operations; forbidden for platform/global operations unless their approved operation contract explicitly requires a target tenant.
      schema:
        $ref: '#/components/schemas/UuidV7'
    AdministrativeTenantId:
      name: tenant_id
      in: query
      required: false
      description: Required for Platform administrative reads of tenant-owned data; forbidden together with a tenant header. Tenant Admin derives tenant only from its validated active header.
      schema: { $ref: '#/components/schemas/UuidV7' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client-provided UUID accepted only when valid; server always returns the effective ID.
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional request attempt identifier; it is not an idempotency key.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required only for operations classified IDEMPOTENCY_KEY_REQUIRED. Bound to ownership, tenant when applicable, actor/client, operation and request fingerprint.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted decimal ETag containing the current positive RetentionPolicy row_version. Weak validators and a body expected_version are rejected.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    MembershipRoleIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted SHA-256 ETag from the current MembershipRole administrative projection. Weak validators are rejected.
      schema: { type: string, pattern: '^"[0-9a-f]{64}"$' }
    Cursor:
      name: page[cursor]
      in: query
      required: false
      schema: { type: string, minLength: 1 }
      description: >-
        Opaque cursor encoding the stable-order components and server-controlled continuation context.
        It is not authority: tenant, entitlement, scope, object policy and filters are revalidated and
        cannot be changed by cursor contents. Offset pagination is not accepted.
    PageSize:
      name: page[size]
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      description: Integer from 1 through 100. Non-integer, below-minimum or above-maximum values return the COMMON HTTP 400 validation error.
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated allowlisted fields; prefix '-' means descending. No arbitrary SQL expressions.
      schema: { type: string }
    Filter:
      name: filter
      in: query
      required: false
      description: Resource-specific allowlisted filter object; generic operators are not authorized by this base contract.
      schema: { type: string }
    LifecycleStateFilter:
      name: filter[lifecycle_state]
      in: query
      required: false
      description: Exact lifecycle-state value from the target resource contract; no generic operator syntax.
      schema: { type: string, minLength: 1 }
    RequirementIdFilter:
      name: filter[requirement_id]
      in: query
      required: false
      description: Existing Requirement reference; visibility of the Requirement is independently enforced.
      schema: { $ref: '#/components/schemas/UuidV7' }
    FrameworkVersionIdFilter:
      name: filter[framework_version_id]
      in: query
      required: false
      description: Existing entitled FrameworkVersion reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    ControlIdFilter:
      name: filter[control_id]
      in: query
      required: false
      description: Existing authorized Control reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    IssueIdFilter:
      name: filter[issue_id]
      in: query
      required: false
      description: Existing authorized parent Issue reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    ScopeSubjectIdFilter:
      name: filter[scope_subject_id]
      in: query
      required: false
      description: Existing same-tenant Subject used by the canonical scope relationship.
      schema: { $ref: '#/components/schemas/UuidV7' }
    OwnerSubjectIdFilter:
      name: filter[business_owner_subject_id]
      in: query
      required: false
      description: Existing same-tenant business-owner Subject; object policy remains authoritative.
      schema: { $ref: '#/components/schemas/UuidV7' }
    AssignedMembershipIdFilter:
      name: filter[assigned_membership_id]
      in: query
      required: false
      description: Existing active same-tenant membership used by the canonical assignment relationship.
      schema: { $ref: '#/components/schemas/UuidV7' }
    DueFromFilter:
      name: filter[due_from]
      in: query
      required: false
      description: Inclusive lower bound for an existing due date/timestamp field.
      schema: { type: string, format: date }
    DueToFilter:
      name: filter[due_to]
      in: query
      required: false
      description: Inclusive upper bound for an existing due date/timestamp field.
      schema: { type: string, format: date }
    ExpiresFromFilter:
      name: filter[expires_from]
      in: query
      required: false
      description: Inclusive lower bound over authorized EvidenceVersion expiry metadata.
      schema: { type: string, format: date-time }
    ExpiresToFilter:
      name: filter[expires_to]
      in: query
      required: false
      description: Inclusive upper bound over authorized EvidenceVersion expiry metadata.
      schema: { type: string, format: date-time }
  headers:
    CorrelationId:
      description: Effective end-to-end correlation UUID.
      schema: { type: string, format: uuid }
    RequestId:
      description: Server request attempt UUID.
      schema: { type: string, format: uuid }
    IdempotencyReplayed:
      description: 'true when response is the persisted replay for the same fingerprint.'
      schema: { type: boolean }
    CacheControlNoStore:
      description: Sensitive Managed Identity credential-operation responses are never stored by HTTP caches.
      schema: { type: string, const: no-store }
    ETag:
      description: Strong operation-specific resource validator; use the corresponding operation's If-Match contract.
      schema: { type: string }
  schemas:
    ComplianceMethodology:
      type: object
      additionalProperties: false
      required: [methodology_version_ref, methodology_code, version_number, name, rector_source, rector_version, formula_definition_id, minimum_coverage, effective_from, effective_to, published_at, partial_compliance_factor]
      properties:
        methodology_version_ref: { $ref: '#/components/schemas/UuidV7' }
        methodology_code: { type: string }
        version_number: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        rector_source: { type: string }
        rector_version: { type: string }
        formula_definition_id: { $ref: '#/components/schemas/UuidV7' }
        minimum_coverage: { type: number, minimum: 0, maximum: 100 }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, 'null'], format: date-time }
        published_at: { type: string, format: date-time }
        partial_compliance_factor: { type: number, minimum: 0, maximum: 1 }
    ControlEffectivenessMethodology:
      type: object
      additionalProperties: false
      required: [methodology_version_ref, methodology_code, version_number, name, rector_source, rector_version, formula_definition_id, minimum_coverage, effective_from, effective_to, published_at]
      properties:
        methodology_version_ref: { $ref: '#/components/schemas/UuidV7' }
        methodology_code: { type: string }
        version_number: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        rector_source: { type: string }
        rector_version: { type: string }
        formula_definition_id: { $ref: '#/components/schemas/UuidV7' }
        minimum_coverage: { type: number, minimum: 0, maximum: 100 }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, 'null'], format: date-time }
        published_at: { type: string, format: date-time }
    TenantUserOnboardingRequest:
      type: object
      additionalProperties: false
      required: [user_identity_id, tenant_role_codes, reason]
      properties:
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        tenant_role_codes: { type: array, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128, pattern: '\S' } }
        reason: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
    TenantUserOnboardingProgress:
      type: object
      additionalProperties: false
      required: [tenant_id, user_identity_id, membership_id, completed_roles, pending_role_codes]
      properties:
        tenant_id: { $ref: '#/components/schemas/UuidV7' }
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        membership_id: { $ref: '#/components/schemas/UuidV7' }
        completed_roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role_code, membership_role_id]
            properties:
              role_code: { type: string, minLength: 1, maxLength: 128 }
              membership_role_id: { $ref: '#/components/schemas/UuidV7' }
        pending_role_codes: { type: array, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
    TenantUserOnboardingResult:
      allOf:
        - { $ref: '#/components/schemas/TenantUserOnboardingProgress' }
        - properties: { pending_role_codes: { maxItems: 0 } }
    TenantUserOnboardingError:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: false
          required: [tenant_user_onboarding_progress]
          properties:
            tenant_user_onboarding_progress: { $ref: '#/components/schemas/TenantUserOnboardingProgress' }
    UserIdentityTenantAccessPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        page: { $ref: '#/components/schemas/PageMeta' }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tenant_membership_id, tenant_id, user_identity_id, membership_state, joined_at, ended_at, tenant, roles]
            properties:
              tenant_membership_id: { $ref: '#/components/schemas/UuidV7' }
              tenant_id: { $ref: '#/components/schemas/UuidV7' }
              user_identity_id: { $ref: '#/components/schemas/UuidV7' }
              membership_state: { type: string }
              joined_at: { $ref: '#/components/schemas/UtcTimestamp' }
              ended_at: { type: [string, 'null'], format: date-time }
              tenant:
                type: object
                additionalProperties: false
                required: [display_name, tenant_code, lifecycle_state]
                properties:
                  display_name: { type: string }
                  tenant_code: { type: string }
                  lifecycle_state: { type: string }
              roles:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [membership_role_id, role_id, role_code, role_name, scope_kind, valid_from, valid_to, etag]
                  properties:
                    membership_role_id: { $ref: '#/components/schemas/UuidV7' }
                    role_id: { $ref: '#/components/schemas/UuidV7' }
                    role_code: { type: string }
                    role_name: { type: string }
                    scope_kind: { type: string, enum: [tenant, organizational_unit, process, service, audit_engagement, assigned_object, owned_object] }
                    valid_from: { $ref: '#/components/schemas/UtcTimestamp' }
                    valid_to: { type: [string, 'null'], format: date-time }
                    etag: { type: string, pattern: '^[0-9a-f]{64}$' }
    PlatformRoleCode:
      type: string
      description: Closed platform functional family from rector42/executable24; catalog eligibility is decided by backend publication metadata, never this enum alone.
      enum: [PLATFORM_ADMIN, PLATFORM_SUPPORT]
    PlatformRoleAssignmentReadProjection:
      type: object
      additionalProperties: false
      required: [platform_role_assignment_id, user_identity_id, role_code, role_name, valid_from, valid_to]
      properties:
        platform_role_assignment_id: { $ref: '#/components/schemas/UuidV7' }
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        role_code: { $ref: '#/components/schemas/PlatformRoleCode' }
        role_name: { type: string }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
    PlatformRoleAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/PlatformRoleAssignmentReadProjection' }
    PlatformRoleAssignRequest:
      type: object
      additionalProperties: false
      required: [role_code, reason]
      properties:
        role_code: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
    PlatformRoleRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
    PlatformRoleAssignmentProjection:
      type: object
      additionalProperties: false
      required: [platform_role_assignment_id, user_identity_id, role_code, valid_from, valid_to]
      properties:
        platform_role_assignment_id: { $ref: '#/components/schemas/UuidV7' }
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        role_code: { type: string }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
    AuthenticationProvider:
      type: string
      enum: [ZOHO, MICROSOFT_ENTRA_ID, GOOGLE_WORKSPACE, TCDX_MANAGED_IDENTITY]
    AuthenticationProviderAvailabilityEntry:
      type: object
      additionalProperties: false
      required: [provider, available]
      properties:
        provider: { $ref: '#/components/schemas/AuthenticationProvider' }
        available:
          type: boolean
          description: "Validated canonical backend configuration and enabled registered browser flow; not live IdP health."
    AuthenticationProviderAvailability:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/AuthenticationProviderAvailabilityEntry' }
          allOf:
            - contains: { type: object, required: [provider], properties: { provider: { const: ZOHO } } }
              minContains: 1
              maxContains: 1
            - contains: { type: object, required: [provider], properties: { provider: { const: MICROSOFT_ENTRA_ID } } }
              minContains: 1
              maxContains: 1
            - contains: { type: object, required: [provider], properties: { provider: { const: GOOGLE_WORKSPACE } } }
              minContains: 1
              maxContains: 1
            - contains: { type: object, required: [provider], properties: { provider: { const: TCDX_MANAGED_IDENTITY } } }
              minContains: 1
              maxContains: 1
    TenantPermissionScope:
      type: object
      additionalProperties: false
      required: [scope_kind]
      properties:
        scope_kind:
          type: string
          enum: [tenant, organizational_unit, process, service, audit_engagement, assigned_object, owned_object]
        organizational_unit_id: { $ref: '#/components/schemas/UuidV7' }
        process_id: { $ref: '#/components/schemas/UuidV7' }
        service_id: { $ref: '#/components/schemas/UuidV7' }
        audit_id: { $ref: '#/components/schemas/UuidV7' }
      allOf:
        - if: { required: [scope_kind], properties: { scope_kind: { const: organizational_unit } } }
          then: { required: [organizational_unit_id] }
          else: { not: { required: [organizational_unit_id] } }
        - if: { required: [scope_kind], properties: { scope_kind: { const: process } } }
          then: { required: [process_id] }
          else: { not: { required: [process_id] } }
        - if: { required: [scope_kind], properties: { scope_kind: { const: service } } }
          then: { required: [service_id] }
          else: { not: { required: [service_id] } }
        - if: { required: [scope_kind], properties: { scope_kind: { const: audit_engagement } } }
          then: { required: [audit_id] }
          else: { not: { required: [audit_id] } }
      description: "Exact own persisted scope grant; structural references remain same-tenant. owned_object and assigned_object require independent target policy, not invented object IDs."
    CurrentPrincipalTenantPermissions:
      type: object
      additionalProperties: false
      required: [tenant_id, permissions]
      properties:
        tenant_id: { $ref: '#/components/schemas/UuidV7' }
        permissions:
          type: object
          propertyNames:
            type: string
            minLength: 1
            maxLength: 160
            pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2}$'
            not:
              enum: [platform.managed_identity.read, platform.managed_identity.create, platform.managed_identity.update, platform.managed_identity.administer]
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: '#/components/schemas/TenantPermissionScope' }
          description: "Only effective published permission codes from catalog 05; each maps solely to its own entitled active assignment scopes. No role names or scope borrowing. Unknown/unpublished/platform-only codes omitted."
    CurrentPrincipalAuthorization:
      type: object
      additionalProperties: false
      required: [evaluated_at, platform_permissions, tenant_permissions]
      properties:
        evaluated_at: { $ref: '#/components/schemas/UtcTimestamp' }
        platform_permissions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2}$' }
          description: "Lexically ordered effective published platform-scope grants through active PlatformRoleAssignment; not target-specific ALLOW."
        tenant_permissions:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/CurrentPrincipalTenantPermissions' }
      description: "Ephemeral own context eligibility for presentation only. Absence/error is DENY. Backend permission, scope, entitlement, object policy and SoD remain required per request."
    ValidationAccessCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ValidationAccessCandidate' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    ValidationAccessCandidate:
      type: object
      additionalProperties: false
      required: [regulatory_pack_version_id, regulatory_pack_validation_provenance_id, pack_code, name, edition, license_classification, version_state, pack_state, authority_class, source_role, provenance_ref, version_effective_from, version_effective_to]
      properties:
        regulatory_pack_version_id: { $ref: '#/components/schemas/UuidV7' }
        regulatory_pack_validation_provenance_id: { $ref: '#/components/schemas/UuidV7' }
        pack_code: { type: string }
        name: { type: string }
        edition: { type: string }
        license_classification: { type: string, enum: [NOT_YET_LICENSED, non_authoritative_test_pack] }
        version_state: { type: string, enum: [draft] }
        pack_state: { type: string, enum: [draft] }
        authority_class: { type: string, enum: [NON_AUTHORITATIVE_TEST_PACK] }
        source_role: { type: string, enum: [provisional_supporting_reference, supporting_reference, test_data_source] }
        provenance_ref: { type: string }
        version_effective_from: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        version_effective_to: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
    UuidV7:
      type: string
      format: uuid
      description: Opaque platform-generated UUIDv7; consumers must not derive semantics from it.
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with UTC offset Z at the API boundary.
    DataClassification:
      type: string
      enum: [public, internal, confidential, restricted]
      description: Closed, versioned Platform vocabulary. tenantCreate always persists the server-owned initial value confidential.
    ManagedIdentityProjection:
      type: object
      additionalProperties: false
      description: Safe global identity metadata; no credential, token, seed or unrestricted membership data.
      required: [user_identity_id, provider, issuer, subject_reference, username, display_name, identity_lifecycle_state, enabled, mfa_enrolled]
      properties:
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        provider: { type: string, enum: [tcdx-managed-identity] }
        issuer: { type: string, const: 'https://iam.grc.tecdex.net/realms/tcdx-managed-identity' }
        subject_reference: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        identity_lifecycle_state: { type: string }
        enabled: { type: boolean }
        mfa_enrolled: { type: boolean }
    ManagedIdentityCredentialOperationResult:
      type: object
      additionalProperties: false
      description: >-
        Shared Provision/PasswordReset result. The original successful HTTPS response may disclose a
        newly generated temporary credential once; same-key replay is safe metadata only.
      required: [identity, credential_disclosed]
      properties:
        identity: { $ref: '#/components/schemas/ManagedIdentityProjection' }
        credential_disclosed: { type: boolean }
        temporary_credential:
          type: string
          minLength: 1
          description: Present only on the original successful response when credential_disclosed is true; never persisted or replayed.
      allOf:
        - if:
            properties: { credential_disclosed: { const: true } }
          then:
            required: [temporary_credential]
          else:
            not: { required: [temporary_credential] }
    ManagedIdentityPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManagedIdentityProjection' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    UserIdentityDiscoveryCandidate:
      type: object
      additionalProperties: false
      required: [user_identity_id, display_name, provider, provider_display, lifecycle_state]
      properties:
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        display_name: { type: [string, 'null'], maxLength: 255 }
        provider: { type: [string, 'null'], description: 'Existing verified provider binding only; never inferred from email/username.' }
        provider_display: { type: [string, 'null'], maxLength: 255 }
        lifecycle_state: { type: string, const: active }
        username: { type: [string, 'null'], maxLength: 255, description: 'Platform mode only; verified presentation metadata, never authority.' }
        email_normalized: { type: [string, 'null'], format: email, description: 'Platform mode only; safe presentation metadata, never identity key.' }
      description: 'Executable25 forbids username/email fields in tenant_exact response. No issuer/subject/identity_key/marker/MFA/credential fields.'
    UserIdentityDiscoveryPage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/UserIdentityDiscoveryCandidate' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
      description: 'Platform cursor page; tenant exact zero/one result, has_more=false,next_cursor=null. Hidden/none/inactive/ambiguous indistinguishable.'
    UserIdentityDiscoveryTenantCandidate:
      type: object
      additionalProperties: false
      required: [user_identity_id, display_name, provider, provider_display, lifecycle_state]
      properties:
        user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        display_name: { type: [string, 'null'], maxLength: 255 }
        provider: { type: [string, 'null'] }
        provider_display: { type: [string, 'null'], maxLength: 255 }
        lifecycle_state: { type: string, const: active }
        existing_membership_id: { $ref: '#/components/schemas/UuidV7', description: 'Own-tenant active Membership only, otherwise omitted.' }
    UserIdentityDiscoveryTenantPage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/UserIdentityDiscoveryTenantCandidate' } }
        meta:
          type: object
          additionalProperties: false
          required: [has_more, next_cursor]
          properties:
            has_more: { type: boolean, const: false }
            next_cursor: { type: 'null' }
    TenantInitialAdministratorSelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, user_identity_id]
          properties:
            kind: { type: string, const: existing_identity }
            user_identity_id: { $ref: '#/components/schemas/UuidV7' }
        - type: object
          additionalProperties: false
          required: [kind, user_identity_id]
          properties:
            kind: { type: string, const: provisioned_managed_identity }
            user_identity_id: { $ref: '#/components/schemas/UuidV7' }
