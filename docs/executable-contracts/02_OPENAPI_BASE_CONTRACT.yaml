tags: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC/OAuth 2.x access token. Backend validates configured issuer, audience, signature/JWKS, time claims and principal class before GRC authorization.
  parameters:
    TenantContext:
      name: X-TCDX-Tenant-Id
      in: header
      required: true
      description: UUIDv7 tenant context for tenant business operations; forbidden for platform/global operations unless their approved operation contract explicitly requires a target tenant.
      schema:
        $ref: '#/components/schemas/UuidV7'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client-provided UUID accepted only when valid; server always returns the effective ID.
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional request attempt identifier; it is not an idempotency key.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required only for operations classified IDEMPOTENCY_KEY_REQUIRED. Bound to ownership, tenant when applicable, actor/client, operation and request fingerprint.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag representing current row_version for mutable critical resources.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Cursor:
      name: page[cursor]
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    PageSize:
      name: page[size]
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
      description: Maximum and default require human approval per resource/volumetry; clients must not assume them.
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated allowlisted fields; prefix '-' means descending. No arbitrary SQL expressions.
      schema: { type: string }
    Filter:
      name: filter
      in: query
      required: false
      description: Resource-specific allowlisted filter object; generic operators are not authorized by this base contract.
      schema: { type: string }
    LifecycleStateFilter:
      name: filter[lifecycle_state]
      in: query
      required: false
      description: Exact lifecycle-state value from the target resource contract; no generic operator syntax.
      schema: { type: string, minLength: 1 }
    RequirementIdFilter:
      name: filter[requirement_id]
      in: query
      required: false
      description: Existing Requirement reference; visibility of the Requirement is independently enforced.
      schema: { $ref: '#/components/schemas/UuidV7' }
    FrameworkVersionIdFilter:
      name: filter[framework_version_id]
      in: query
      required: false
      description: Existing entitled FrameworkVersion reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    ControlIdFilter:
      name: filter[control_id]
      in: query
      required: false
      description: Existing authorized Control reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    IssueIdFilter:
      name: filter[issue_id]
      in: query
      required: false
      description: Existing authorized parent Issue reference.
      schema: { $ref: '#/components/schemas/UuidV7' }
    ScopeSubjectIdFilter:
      name: filter[scope_subject_id]
      in: query
      required: false
      description: Existing same-tenant Subject used by the canonical scope relationship.
      schema: { $ref: '#/components/schemas/UuidV7' }
    OwnerSubjectIdFilter:
      name: filter[business_owner_subject_id]
      in: query
      required: false
      description: Existing same-tenant business-owner Subject; object policy remains authoritative.
      schema: { $ref: '#/components/schemas/UuidV7' }
    AssignedMembershipIdFilter:
      name: filter[assigned_membership_id]
      in: query
      required: false
      description: Existing active same-tenant membership used by the canonical assignment relationship.
      schema: { $ref: '#/components/schemas/UuidV7' }
    DueFromFilter:
      name: filter[due_from]
      in: query
      required: false
      description: Inclusive lower bound for an existing due date/timestamp field.
      schema: { type: string, format: date }
    DueToFilter:
      name: filter[due_to]
      in: query
      required: false
      description: Inclusive upper bound for an existing due date/timestamp field.
      schema: { type: string, format: date }
    ExpiresFromFilter:
      name: filter[expires_from]
      in: query
      required: false
      description: Inclusive lower bound over authorized EvidenceVersion expiry metadata.
      schema: { type: string, format: date-time }
    ExpiresToFilter:
      name: filter[expires_to]
      in: query
      required: false
      description: Inclusive upper bound over authorized EvidenceVersion expiry metadata.
      schema: { type: string, format: date-time }
  headers:
    CorrelationId:
      description: Effective end-to-end correlation UUID.
      schema: { type: string, format: uuid }
    RequestId:
      description: Server request attempt UUID.
      schema: { type: string, format: uuid }
    ETag:
      description: Strong row_version ETag for mutable resources.
      schema: { type: string }
    IdempotencyReplayed:
      description: 'true when response is the persisted replay for the same fingerprint.'
      schema: { type: boolean }
  schemas:
    UuidV7:
      type: string
      format: uuid
      description: Opaque platform-generated UUIDv7; consumers must not derive semantics from it.
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with UTC offset Z at the API boundary.
    OwnershipClass:
      type: string
      enum: [GLOBAL_REFERENCE, PLATFORM_CONTROL, TENANT_OWNED, TENANT_DERIVED]
    CalculationStatus:
      type: string
      enum: [pending, running, succeeded, failed, cancelled]
    ResultStatus:
      type: string
      enum: [valid, no_data, insufficient_data, insufficient_coverage, stale_source, conflicting_sources, dependency_pending, invalid_input, source_error, calculation_error, not_applicable, superseded]
    ResultEnvelope:
      type: object
      additionalProperties: false
      required: [result_status, period, lineage]
      properties:
        value: {}
        unit: { type: [string, 'null'] }
        result_status: { $ref: '#/components/schemas/ResultStatus' }
        domain_conclusion: { type: [string, 'null'] }
        period:
          type: object
          additionalProperties: false
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
        coverage_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        freshness_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        data_trust:
          type: [object, 'null']
          description: DataQualityAssessment reference/status; never silently alters value.
        versions: { type: object }
        lineage: { type: object }
        preview: { type: boolean, default: false }
      description: value is official only when result_status=valid; non-valid candidate values require preview=true and methodology authority.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_\.]*$' }
        message: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        details:
          type: object
          description: Allowlisted, non-secret details only; never SQL, stack traces, cross-tenant identifiers or signed URLs.
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    PageMeta:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    RequirementApplicabilityProjection:
      type: object
      additionalProperties: false
      required: [requirement_applicability_id, requirement_id, applicability_version, applicability_decision, lifecycle_state, effective_from]
      properties:
        requirement_applicability_id: { $ref: '#/components/schemas/UuidV7' }
        requirement_id: { $ref: '#/components/schemas/UuidV7' }
        scope_subject_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        applicability_version: { type: integer, format: int64, minimum: 1 }
        applicability_decision: { type: string }
        rationale: { type: string }
        lifecycle_state: { type: string }
        effective_from: { $ref: '#/components/schemas/UtcTimestamp' }
        effective_to: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        approved_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
    RequirementAssessmentProjection:
      type: object
      additionalProperties: false
      required: [requirement_assessment_id, requirement_applicability_id, methodology_version_ref, lifecycle_state, result_status]
      properties:
        requirement_assessment_id: { $ref: '#/components/schemas/UuidV7' }
        requirement_applicability_id: { $ref: '#/components/schemas/UuidV7' }
        methodology_version_ref: { $ref: '#/components/schemas/UuidV7' }
        lifecycle_state: { type: string }
        result_status: { $ref: '#/components/schemas/ResultStatus' }
        domain_conclusion: { type: [string, 'null'] }
        coverage_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        assessed_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        approved_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        effective_configuration_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        superseded_by_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
    StatementOfApplicabilityItemProjection:
      type: object
      additionalProperties: false
      required: [statement_of_applicability_item_id, reference_control_version_id, applicability_decision, justification, implementation_state]
      properties:
        statement_of_applicability_item_id: { $ref: '#/components/schemas/UuidV7' }
        reference_control_version_id: { $ref: '#/components/schemas/UuidV7' }
        applicability_decision: { type: string }
        justification: { type: string }
        implementation_state: { type: string }
        tenant_control_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        tenant_control_version_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
    StatementOfApplicabilityProjection:
      type: object
      additionalProperties: false
      required: [statement_of_applicability_id, framework_version_id, soa_version, title, lifecycle_state]
      properties:
        statement_of_applicability_id: { $ref: '#/components/schemas/UuidV7' }
        framework_version_id: { $ref: '#/components/schemas/UuidV7' }
        soa_version: { type: integer, format: int64, minimum: 1 }
        title: { type: string }
        lifecycle_state: { type: string }
        effective_from: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        effective_to: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        approved_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        published_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        superseded_by_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        items:
          type: array
          items: { $ref: '#/components/schemas/StatementOfApplicabilityItemProjection' }
          description: Present only on authorized detail projection.
    ControlVersionProjection:
      type: object
      additionalProperties: false
      required: [control_version_id, control_id, version_number, objective, control_type, nature, frequency_code, execution_method, verification_method, minimum_evidence, lifecycle_state]
      properties:
        control_version_id: { $ref: '#/components/schemas/UuidV7' }
        control_id: { $ref: '#/components/schemas/UuidV7' }
        version_number: { type: integer, format: int64, minimum: 1 }
        objective: { type: string }
        control_type: { type: string }
        nature: { type: string }
        frequency_code: { type: string }
        execution_method: { type: string }
        verification_method: { type: string }
        minimum_evidence: { type: string }
        suggested_owner_role_code: { type: [string, 'null'] }
        lifecycle_state: { type: string }
        effective_from: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        effective_to: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        published_at: { oneOf: [{ $ref: '#/components/schemas/UtcTimestamp' }, { type: 'null' }] }
        superseded_by_id: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
    ControlObjectiveProjection:
      type: object
      additionalProperties: false
      required: [control_objective_id, control_version_id, objective_code, description, display_order]
      properties:
        control_objective_id: { $ref: '#/components/schemas/UuidV7' }
